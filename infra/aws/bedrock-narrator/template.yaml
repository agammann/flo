AWSTemplateFormatVersion: "2010-09-09"
Description: Flo Amazon Bedrock narration adapter for the AWS Builder mini challenge.

Parameters:
  ModelId:
    Type: String
    Default: amazon.nova-lite-v1:0
    Description: Bedrock foundation-model ID used for short, non-authoritative narration leads.
  ThrottlingRateLimit:
    Type: Number
    Default: 1
    MinValue: 0.1
    MaxValue: 10
    Description: Best-effort steady-state narration requests per second at the authenticated boundary.
  ThrottlingBurstLimit:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 20
    Description: Best-effort narration-request burst target at the authenticated boundary.

Resources:
  NarratorLogsKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Flo narrator and minimal API access-log encryption only.
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountKeyAdministration
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: "*" # In a key policy this denotes this key, not every key.
          - Sid: EncryptOnlyFloLogs
            Effect: Allow
            Principal:
              Service: !Sub logs.${AWS::Region}.amazonaws.com
            Action: [kms:Encrypt, kms:Decrypt, kms:ReEncrypt*, kms:GenerateDataKey*, kms:DescribeKey]
            Resource: "*"
            Condition:
              ArnEquals:
                kms:EncryptionContext:aws:logs:arn:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/flo-bedrock-narrator
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/apigateway/${AWS::StackName}-access
          # The Logs service grant does not replace the caller-role grant.
          # Resource * in this key policy means only this containing key.
          - Sid: NarratorLogCryptoViaCloudWatch
            Effect: Allow
            Principal:
              AWS: !GetAtt NarratorRole.Arn
            Action: [kms:Encrypt, kms:Decrypt, kms:ReEncryptFrom, kms:ReEncryptTo, kms:GenerateDataKey, kms:GenerateDataKeyWithoutPlaintext]
            Resource: "*"
            Condition:
              StringEquals:
                kms:ViaService: !Sub logs.${AWS::Region}.amazonaws.com
                kms:CallerAccount: !Ref AWS::AccountId
              ArnEquals:
                kms:EncryptionContext:aws:logs:arn: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/flo-bedrock-narrator
          # DescribeKey has no encryption-context input. Keep metadata separate
          # rather than allowing contextless crypto with an IfExists condition.
          - Sid: NarratorLogKeyMetadataViaCloudWatch
            Effect: Allow
            Principal:
              AWS: !GetAtt NarratorRole.Arn
            Action: kms:DescribeKey
            Resource: "*"
            Condition:
              StringEquals:
                kms:ViaService: !Sub logs.${AWS::Region}.amazonaws.com
                kms:CallerAccount: !Ref AWS::AccountId

  NarrationAllowanceKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Flo allowance encryption. Retain while any table or backup uses this key.
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountKeyAdministration
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: "*"
          - Sid: NarratorTableKeyDecryption
            Effect: Allow
            Principal:
              AWS: !GetAtt NarratorRole.Arn
            Action: kms:Decrypt
            Resource: "*"
            Condition:
              StringEquals:
                kms:CallerAccount: !Ref AWS::AccountId
                kms:ViaService: !Sub dynamodb.${AWS::Region}.amazonaws.com
                kms:EncryptionContext:aws:dynamodb:tableName: flo-narration-allowance

  NarrationAllowance:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: flo-narration-allowance
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !GetAtt NarrationAllowanceKey.Arn
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
        RecoveryPeriodInDays: 7

  NarratorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  # Preserve the existing runtime actions while moving out of inline role policies.
  NarratorRuntimePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Flo model invocation and fixed-key allowance update; handler code enforces conditional decrements.
      Roles: [!Ref NarratorRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: bedrock:InvokeModel
            Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${ModelId}
          - Effect: Allow
            Action: dynamodb:UpdateItem
            Resource: !GetAtt NarrationAllowance.Arn
            Condition:
              ForAllValues:StringEquals:
                dynamodb:LeadingKeys: [flo-lifetime-v1]
              "Null":
                dynamodb:LeadingKeys: "false"

  # Existing deployments must IMPORT this already-created group before UPDATE.
  # Preserve its functional name; never delete logs to resolve a name collision.
  NarratorLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /aws/lambda/flo-bedrock-narrator
      RetentionInDays: 7
      KmsKeyId: !GetAtt NarratorLogsKey.Arn

  NarratorAccessLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/apigateway/${AWS::StackName}-access
      RetentionInDays: 7
      KmsKeyId: !GetAtt NarratorLogsKey.Arn

  NarratorFunction:
    Type: AWS::Lambda::Function
    DependsOn: [NarratorRuntimePolicy, NarratorLogGroup]
    Properties:
      FunctionName: flo-bedrock-narrator
      Description: Uses Amazon Bedrock only for a short narration lead; deterministic Flo code owns all operational facts.
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt NarratorRole.Arn
      Timeout: 8
      MemorySize: 256
      ReservedConcurrentExecutions: 2 # Requires at least 102 regional concurrency; never replace with zero.
      Environment:
        Variables:
          MODEL_ID: !Ref ModelId
          ALLOWANCE_TABLE: !Ref NarrationAllowance
      Code:
        ZipFile: |
          const { BedrockRuntimeClient, ConverseCommand } = require("@aws-sdk/client-bedrock-runtime");
          const { DynamoDBClient, UpdateItemCommand } = require("@aws-sdk/client-dynamodb");
          const client = new BedrockRuntimeClient({ maxAttempts: 1 });
          const ledger = new DynamoDBClient({ maxAttempts: 1 });
          exports.handler = async (event) => {
            const headers = { "content-type": "application/json", "cache-control": "no-store" };
            try {
              // API Gateway validates SigV4 before invocation. No public marker is trusted.
              if (!event.requestContext?.authorizer?.iam?.userArn) {
                return { statusCode: 403, headers, body: JSON.stringify({ error: "Forbidden" }) };
              }
              if (event.isBase64Encoded || typeof event.body !== "string" || event.body.length > 512) {
                return { statusCode: 400, headers, body: JSON.stringify({ error: "Invalid narration request" }) };
              }
              let body;
              try { body = JSON.parse(event.body); } catch {
                return { statusCode: 400, headers, body: JSON.stringify({ error: "Invalid narration request" }) };
              }
              if (!body || body.task !== "part-comparison-lead" || !Number.isInteger(body.optionCount) || body.optionCount < 1 || body.optionCount > 10 || !["budget", "standard", "premium", "oem"].includes(body.qualityTier)) {
                return { statusCode: 400, headers, body: JSON.stringify({ error: "Invalid narration request" }) };
              }
              if (!process.env.ALLOWANCE_TABLE) throw new Error("Allowance configuration missing");
              // Reserve atomically BEFORE sending. Never refund uncertain/failed calls.
              // Missing rows fail closed: only an operator may initialize once.
              try {
                await ledger.send(new UpdateItemCommand({
                  TableName: process.env.ALLOWANCE_TABLE,
                  Key: { id: { S: "flo-lifetime-v1" } },
                  UpdateExpression: "SET remaining = remaining - :one ADD used :one",
                  ConditionExpression: "attribute_exists(id) AND schemaVersion = :version AND remaining BETWEEN :one AND :limit",
                  ExpressionAttributeValues: { ":one": { N: "1" }, ":limit": { N: "100" }, ":version": { N: "1" } }
                }));
              } catch (error) {
                if (error.name === "ConditionalCheckFailedException") {
                  return { statusCode: 429, headers, body: JSON.stringify({ error: "Narration allowance unavailable or exhausted" }) };
                }
                throw new Error("Narration allowance unavailable");
              }
              const qualityTier = body.qualityTier;
              const prompt = `Write one calm sentence of at most twelve words explaining that comparing ${body.optionCount} ${qualityTier} service-part options helps a technician choose confidently. Do not use digits, prices, dates, supplier names, part numbers, claims of completion, or markdown.`;
              const command = new ConverseCommand({
                modelId: process.env.MODEL_ID,
                messages: [{ role: "user", content: [{ text: prompt }] }],
                inferenceConfig: { maxTokens: 60, temperature: 0.2, topP: 0.8 }
              });
              const result = await client.send(command);
              const lead = result.output?.message?.content?.find((item) => typeof item.text === "string")?.text?.trim();
              const wordCount = lead?.split(/\s+/).length ?? 0;
              if (!lead || lead.length < 8 || lead.length > 160 || wordCount > 16 || /[$\d\n\r*#`]/.test(lead)) {
                throw new Error("Model response failed the narration contract");
              }
              return { statusCode: 200, headers, body: JSON.stringify({ lead, modelId: process.env.MODEL_ID }) };
            } catch (error) {
              console.error(JSON.stringify({ event: "flo.narration.failed" }));
              return { statusCode: 502, headers, body: JSON.stringify({ error: "Narration unavailable" }) };
            }
          };

  NarratorApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: flo-bedrock-narrator
      Description: IAM-authenticated ingress for the Flo Bedrock narrator.
      ProtocolType: HTTP

  NarratorIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref NarratorApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt NarratorFunction.Arn
      IntegrationMethod: POST
      PayloadFormatVersion: "2.0"

  NarratorRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref NarratorApi
      RouteKey: POST /narrate
      AuthorizationType: AWS_IAM
      Target: !Join ["/", [integrations, !Ref NarratorIntegration]]

  NarratorStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref NarratorApi
      StageName: $default
      AutoDeploy: true
      AccessLogSettings:
        DestinationArn: !GetAtt NarratorAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","status":"$context.status","latency":"$context.responseLatency"}'
      DefaultRouteSettings:
        ThrottlingRateLimit: !Ref ThrottlingRateLimit
        ThrottlingBurstLimit: !Ref ThrottlingBurstLimit

  NarratorApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref NarratorFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${NarratorApi}/*/*/narrate

Outputs:
  NarratorEndpointUrl:
    Description: IAM-authenticated endpoint. Server caller must SigV4-sign requests and have execute-api:Invoke permission.
    Value: !Sub https://${NarratorApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/narrate
  NarratorFunctionName:
    Value: !Ref NarratorFunction
  NarratorInvokeArn:
    Description: Grant execute-api:Invoke on only this ARN to the simulator server role.
    Value: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${NarratorApi}/$default/POST/narrate
  AllowanceTableName:
    Value: !Ref NarrationAllowance
  BedrockModelId:
    Value: !Ref ModelId
  NarratorThrottle:
    Description: API Gateway steady-state and burst request limits.
    Value: !Sub ${ThrottlingRateLimit} requests/second; burst ${ThrottlingBurstLimit}
