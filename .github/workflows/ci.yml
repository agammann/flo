name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Type-aware ESLint resolves workspace packages through their generated
      # declaration files, so a clean runner must build before lint/typecheck.
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  docker-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: docker compose version
      - run: docker compose config --quiet
      - run: docker compose build mcp
      - run: docker compose up --no-build -d
      - run: node scripts/docker-smoke.mjs
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes --remove-orphans
