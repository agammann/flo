version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "flo-demo"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
