services:
  flo-dynamodb-test:
    image: amazon/dynamodb-local@sha256:6ada631ec7aa5fc83446855eb17233e3dad184fec47477e8140c6c569cfe0c86
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    networks: [customer-test]
  customer-contract:
    image: ${FLO_CUSTOMER_TEST_IMAGE:-flo-demo:local}
    command: ["node", "scripts/run-customer-database-contracts.mjs"]
    environment:
      FLO_DYNAMODB_LOCAL_ENDPOINT: http://flo-dynamodb-test:8000
    depends_on: [flo-dynamodb-test]
    networks: [customer-test]
networks:
  customer-test:
    internal: true
