services:
  flo-dynamodb-test:
    image: amazon/dynamodb-local@sha256:ff89bd48ff32cd8d9be5fee8873b65b8854dc408f1afe881be6eb00247bc0dab
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    networks: [customer-test]
  customer-contract:
    image: ${FLO_CUSTOMER_TEST_IMAGE:-flo-demo:local}
    command: ["node", "scripts/run-customer-database-contracts.mjs"]
    environment:
      FLO_DYNAMODB_LOCAL_ENDPOINT: http://flo-dynamodb-test:8000
    depends_on: [flo-dynamodb-test]
    networks: [customer-test]
networks:
  customer-test:
    internal: true
